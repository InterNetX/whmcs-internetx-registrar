name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version with commit hash
        run: |
          BASE_VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          RELEASE_VERSION="${BASE_VERSION}-${SHORT_SHA}"
          echo "${RELEASE_VERSION}" > VERSION
          echo "RELEASE_TAG=release/${RELEASE_VERSION}" >> $GITHUB_ENV

      - name: Build all modules
        run: ./makeAllModules.sh

      - name: Create tag
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/InterNetX_whmcs.zip
            dist/DomainRobot_whmcs.zip
            dist/SchlundTech_whmcs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
